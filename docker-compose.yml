services:
  # ===================
  # Infrastructure
  # ===================
  psql:
    image: postgres:16-alpine
    container_name: kipusalud-psql
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5433:5432"   # solo accesible desde el host (túnel SSH), NO público
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - kipusalud-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: kipusalud-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-kipusalud}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    # Puertos internos: se accede vía http://rabbitmq:5672 dentro de la red docker
    expose:
      - "5672"
      - "15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - kipusalud-network

  # ===================
  # Discovery & Config  (solo internos, no exponer a Internet)
  # ===================
  discovery-server:
    build:
      context: .
      dockerfile: discovery-server/Dockerfile
    container_name: kipusalud-discovery
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_OPTS: -Xms256m -Xmx384m
    expose:
      - "8761"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - kipusalud-network

  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    container_name: kipusalud-config
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: native,docker
      JAVA_OPTS: -Xms256m -Xmx384m
    expose:
      - "8888"
    depends_on:
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - kipusalud-network

  # ===================
  # API Gateway  (única puerta de entrada HTTP además del frontend)
  # ===================
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: kipusalud-gateway
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200,https://kipusalud.pe,https://www.kipusalud.pe}
      JAVA_OPTS: -Xms256m -Xmx512m
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      cliente-service:
        condition: service_healthy
      catalogo-service:
        condition: service_healthy
      ventas-service:
        condition: service_healthy
      personal-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - kipusalud-network

  # ===================
  # Business Services  (puertos internos con 'expose', no públicos)
  # ===================
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: kipusalud-auth
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_HOST: psql
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      DEMO_SESSIONS_ENABLED: ${DEMO_SESSIONS_ENABLED:-false}
      DEMO_SESSION_TTL_MINUTES: ${DEMO_SESSION_TTL_MINUTES:-60}
      JAVA_OPTS: -Xms256m -Xmx384m
    expose:
      - "8081"
    depends_on:
      psql:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - kipusalud-network

  cliente-service:
    build:
      context: .
      dockerfile: cliente-service/Dockerfile
    container_name: kipusalud-cliente
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_HOST: psql
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JAVA_OPTS: -Xms256m -Xmx384m
    expose:
      - "8082"
    depends_on:
      psql:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - kipusalud-network

  catalogo-service:
    build:
      context: .
      dockerfile: catalogo-service/Dockerfile
    container_name: kipusalud-catalogo
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_HOST: psql
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-kipusalud}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      JAVA_OPTS: -Xms256m -Xmx384m
    expose:
      - "8083"
    depends_on:
      psql:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - kipusalud-network

  ventas-service:
    build:
      context: .
      dockerfile: ventas-service/Dockerfile
    container_name: kipusalud-ventas
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_HOST: psql
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-kipusalud}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      CATALOGO_SERVICE_URL: http://catalogo-service:8083
      CLIENTE_SERVICE_URL: http://cliente-service:8082
      SUNAT_MASTER_KEY: ${SUNAT_MASTER_KEY:-}
      SUNAT_ENVIRONMENT: ${SUNAT_ENVIRONMENT:-BETA}
      SUNAT_BETA_URL: ${SUNAT_BETA_URL:-https://e-beta.sunat.gob.pe/ol-ti-itcpfegem-beta/billService}
      SUNAT_PRODUCTION_URL: ${SUNAT_PRODUCTION_URL:-}
      SUNAT_PRODUCTION_ENABLED: ${SUNAT_PRODUCTION_ENABLED:-false}
      JAVA_OPTS: -Xms256m -Xmx384m
    expose:
      - "8084"
    depends_on:
      psql:
        condition: service_healthy
      catalogo-service:
        condition: service_healthy
      cliente-service:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - kipusalud-network

  audit-service:
    build:
      context: .
      dockerfile: audit-service/Dockerfile
    container_name: kipusalud-audit
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_HOST: psql
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-kipusalud}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      JAVA_OPTS: -Xms256m -Xmx384m
    expose:
      - "8086"
    depends_on:
      psql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8086/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - kipusalud-network

  personal-service:
    build:
      context: .
      dockerfile: personal-service/Dockerfile
    container_name: kipusalud-personal
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_HOST: psql
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JAVA_OPTS: -Xms256m -Xmx384m
    expose:
      - "8085"
    depends_on:
      psql:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - kipusalud-network

  # ===================
  # Frontend  (expuesto en 80 para acceso directo / detrás de Caddy o ALB)
  # ===================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kipusalud-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - kipusalud-network

networks:
  kipusalud-network:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
